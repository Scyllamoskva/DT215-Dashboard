<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Duit Tracker 215</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171923; --surface:#20242f; --line:#383e4d;
    --cream:#ede4d3; --cream-dim:#a9a394;
    --gold:#c9a24b; --clay:#c1502e; --clay-dim:#8a4030;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{color:var(--cream);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;padding:0 0 32px;min-height:100vh;}
  .wrap{max-width:460px;margin:0 auto;padding:20px 16px 0;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim);margin:0 0 4px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0 0 2px;color:var(--cream);}
  .tanggal{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cream-dim);margin:0 0 18px;}
  .receipt{position:relative;background:var(--surface);border-radius:2px;padding:22px 20px 18px;margin-bottom:16px;}
  .receipt::before{content:"";position:absolute;top:-9px;left:0;right:0;height:9px;
    background:linear-gradient(135deg,var(--bg) 50%,transparent 50%) 0 0/12px 12px,linear-gradient(-135deg,var(--bg) 50%,transparent 50%) 0 0/12px 12px;
    background-color:var(--surface);background-repeat:repeat-x;}
  .label-kecil{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim);margin:0 0 6px;}
  .total-aset{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:30px;color:var(--gold);letter-spacing:-0.02em;margin:0 0 2px;word-break:break-word;}
  .total-utang{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--clay-dim);}
  .ledger{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px;}
  .ledger-row{display:flex;align-items:baseline;justify-content:space-between;font-size:14px;padding:6px 0;}
  .ledger-row .nama{display:flex;align-items:center;gap:8px;color:var(--cream);}
  .ledger-row .titik{flex:1;border-bottom:1px dotted var(--line);margin:0 8px;transform:translateY(-4px);}
  .ledger-row .nominal{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--cream);white-space:nowrap;}
  .section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim);margin:28px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .month-nav{display:flex;align-items:center;gap:10px;margin:28px 0 10px;}
  .month-nav .judul{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim);flex:1;}
  .month-nav button{background:var(--surface);border:1px solid var(--line);color:var(--cream);width:26px;height:26px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;}
  .month-nav button:disabled{opacity:.35;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat{background:var(--surface);border-radius:2px;padding:14px 10px;}
  .stat .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream-dim);margin-bottom:6px;}
  .stat .v{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;word-break:break-word;}
  .stat.masuk .v{color:var(--gold);} .stat.keluar .v{color:var(--clay);} .stat.selisih .v{color:var(--cream);}
  .chart-card{background:var(--surface);border-radius:2px;padding:18px 16px;margin-bottom:16px;}
  .chart-row{display:flex;gap:18px;align-items:center;}
  .legend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .legend-item .nama{flex:1;color:var(--cream-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legend-item .nominal{font-family:'IBM Plex Mono',monospace;color:var(--cream);flex-shrink:0;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tabs button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--cream-dim);padding:8px 6px;border-radius:20px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;cursor:pointer;}
  .tabs button.aktif{background:var(--gold);border-color:var(--gold);color:#171923;font-weight:600;}
  .trend-legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:11.5px;}
  .trend-legend span{display:flex;align-items:center;gap:6px;color:var(--cream-dim);}
  .trend-legend .garis{width:14px;height:2px;border-radius:2px;}
  .legend-item{cursor:pointer;}
  .legend-item:active{opacity:0.6;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:flex-end;}
  .modal-panel{background:var(--bg);width:100%;max-height:75vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px 28px;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-header h2{font-family:'Fraunces',serif;font-size:18px;margin:0;color:var(--cream);}
  .modal-close{background:var(--surface);border:none;color:var(--cream-dim);width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;}
  .trx-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);}
  .trx-item .trx-info{min-width:0;}
  .trx-item .trx-tgl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--cream-dim);}
  .trx-item .trx-ket{font-size:13.5px;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .trx-item .trx-nominal{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--gold);white-space:nowrap;}
  .trx-empty{text-align:center;color:var(--cream-dim);font-size:13px;padding:20px 0;}
  footer{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--cream-dim);margin-top:26px;letter-spacing:.05em;}
  .center-msg{padding:70px 24px;text-align:center;font-size:14px;line-height:1.6;color:var(--cream-dim);}
  .spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="center-msg"><div class="spinner"></div>Memuat dashboard...</div>
</div>

<script>
  // GANTI baris di bawah ini dengan URL Cloudflare Worker kamu
  // (contoh: https://dt215-proxy.namamu.workers.dev), sebelum upload file ini ke GitHub Pages.
  // Ini BUKAN URL Apps Script langsung - itu tetap disimpan di dalam kode Worker-nya.
  var PROXY_URL = 'https://dt215-proxy.abdurrachmanaldy.workers.dev/';

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var state = { bulan: null, tahun: null, granularity: 'harian' };

  function showError(msg) {
    document.getElementById('root').innerHTML = '<div class="center-msg">⚠️ ' + msg + '</div>';
  }

  function formatRupiah(n) {
    n = Math.round(Number(n) || 0);
    var sign = n < 0 ? '-' : '';
    n = Math.abs(n);
    return sign + 'Rp' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function apiCall(params, onDone) {
    var qs = 'initData=' + encodeURIComponent(tg.initData);
    Object.keys(params).forEach(function (k) { qs += '&' + k + '=' + encodeURIComponent(params[k]); });
    fetch(PROXY_URL + '?' + qs)
      .then(function (res) { return res.json(); })
      .then(onDone)
      .catch(function () {
        onDone({ ok: false, message: 'Gagal menghubungi server. Cek PROXY_URL sudah benar & Worker sudah di-deploy.' });
      });
  }

  function drawDonut(kategoriList) {
    var legend = document.getElementById('legend');
    kategoriList.forEach(function (d) {
      var row = document.createElement('div');
      row.className = 'legend-item';
      row.innerHTML = '<span class="dot" style="background:' + d.warna + '"></span>' +
        '<span class="nama">' + d.nama + '</span>' +
        '<span class="nominal">' + formatRupiah(d.total) + '</span>';
      row.addEventListener('click', function () { showTransaksiKategori(d.nama); });
      legend.appendChild(row);
    });
    var ctx = document.getElementById('chart').getContext('2d');
    var total = kategoriList.reduce(function (a, b) { return a + b.total; }, 0);
    var startAngle = -Math.PI / 2, cx = 60, cy = 60, r = 56;
    kategoriList.forEach(function (d) {
      var slice = (d.total / total) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, startAngle, startAngle + slice);
      ctx.closePath(); ctx.fillStyle = d.warna; ctx.fill();
      startAngle += slice;
    });
    ctx.beginPath(); ctx.arc(cx, cy, 32, 0, Math.PI * 2);
    ctx.fillStyle = '#20242f'; ctx.fill();
  }

  function showTransaksiKategori(namaKategori) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal-panel">' +
        '<div class="modal-header"><h2>' + namaKategori + '</h2><button class="modal-close">✕</button></div>' +
        '<div class="trx-empty">Memuat...</div>' +
      '</div>';
    overlay.addEventListener('click', function (e) { if (e.target === overlay) document.body.removeChild(overlay); });
    overlay.querySelector('.modal-close').addEventListener('click', function () { document.body.removeChild(overlay); });
    document.body.appendChild(overlay);

    apiCall({ action: 'transaksi', kategori: namaKategori, bulan: state.bulan, tahun: state.tahun }, function (res) {
      var panel = overlay.querySelector('.modal-panel');
      if (!res.ok) {
        panel.querySelector('.trx-empty').textContent = res.message || 'Gagal memuat.';
        return;
      }
      if (!res.transaksi || res.transaksi.length === 0) {
        panel.querySelector('.trx-empty').textContent = 'Belum ada transaksi di kategori ini bulan ini.';
        return;
      }
      var html = '<div class="modal-header"><h2>' + namaKategori + '</h2><button class="modal-close">✕</button></div>';
      res.transaksi.forEach(function (t) {
        html +=
          '<div class="trx-item"><div class="trx-info">' +
            '<div class="trx-tgl">' + t.tanggal + (t.subKategori ? ' · ' + t.subKategori : '') + '</div>' +
            '<div class="trx-ket">' + (t.keterangan || '(tanpa keterangan)') + '</div>' +
          '</div><div class="trx-nominal">' + formatRupiah(t.nominal) + '</div></div>';
      });
      panel.innerHTML = html;
      panel.querySelector('.modal-close').addEventListener('click', function () { document.body.removeChild(overlay); });
    });
  }

  function drawTrend(trend) {
    var canvas = document.getElementById('trendChart');
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height, pad = 8;
    ctx.clearRect(0, 0, w, h);
    if (trend.length === 0) return;

    var maxVal = 1;
    trend.forEach(function (t) { maxVal = Math.max(maxVal, t.pemasukan, t.pengeluaran); });

    function pointsFor(key) {
      return trend.map(function (t, i) {
        var x = trend.length === 1 ? w / 2 : pad + (i / (trend.length - 1)) * (w - pad * 2);
        var y = h - pad - (t[key] / maxVal) * (h - pad * 2);
        return [x, y];
      });
    }

    function drawLine(key, color) {
      var pts = pointsFor(key);
      ctx.beginPath();
      pts.forEach(function (p, i) { i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1])});
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      pts.forEach(function (p) { ctx.beginPath(); ctx.arc(p[0], p[1], 2.5, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); });
    }

    drawLine('pemasukan', '#c9a24b');
    drawLine('pengeluaran', '#c1502e');
  }

  function render(data) {
    state.bulan = data.bulan; state.tahun = data.tahun;
    var html = '';
    html += '<p class="eyebrow">Duit Tracker &middot; 215</p><h1>Dashboard</h1>';
    html += '<p class="tanggal">Update terakhir: ' + data.updatedAt + ' WIB</p>';
    html += '<div class="receipt"><p class="label-kecil">Total Aset Likuid</p>';
    html += '<p class="total-aset">' + formatRupiah(data.totalLikuid) + '</p>';
    if (data.totalUtang) html += '<p class="total-utang">Kartu Kredit &amp; PayLater terpakai: ' + formatRupiah(data.totalUtang) + '</p>';
    html += '<div class="ledger">';
    data.saldoList.forEach(function (s) {
      html += '<div class="ledger-row"><span class="nama">' + s.icon + ' ' + s.nama + '</span><span class="titik"></span><span class="nominal">' + formatRupiah(s.saldo) + '</span></div>';
    });
    html += '</div></div>';

    html += '<div class="month-nav"><button id="btnPrev">&#8249;</button><span class="judul">' + data.namaBulan + '</span><button id="btnNext">&#8250;</button></div>';
    html += '<div class="grid3">' +
      '<div class="stat masuk"><div class="k">Masuk</div><div class="v">' + formatRupiah(data.pemasukan) + '</div></div>' +
      '<div class="stat keluar"><div class="k">Keluar</div><div class="v">' + formatRupiah(data.pengeluaran) + '</div></div>' +
      '<div class="stat selisih"><div class="k">Selisih</div><div class="v">' + formatRupiah(data.selisih) + '</div></div></div>';

    if (data.topKategori && data.topKategori.length > 0) {
      html += '<p class="section-title">Pengeluaran per Kategori</p><div class="chart-card"><div class="chart-row">' +
        '<canvas id="chart" width="120" height="120"></canvas><div class="legend" id="legend"></div></div></div>';
    }

    html += '<p class="section-title">Tren Transaksi</p>';
    html += '<div class="tabs" id="tabsGranularity">' +
      '<button data-g="harian" class="' + (state.granularity === 'harian' ? 'aktif' : '') + '">Harian</button>' +
      '<button data-g="mingguan" class="' + (state.granularity === 'mingguan' ? 'aktif' : '') + '">Mingguan</button>' +
      '<button data-g="bulanan" class="' + (state.granularity === 'bulanan' ? 'aktif' : '') + '">Bulanan</button></div>';
    html += '<div class="chart-card"><canvas id="trendChart" width="400" height="140" style="width:100%;height:110px;"></canvas>' +
      '<div class="trend-legend"><span><span class="garis" style="background:#c9a24b"></span>Pemasukan</span>' +
      '<span><span class="garis" style="background:#c1502e"></span>Pengeluaran</span></div></div>';

    html += '<footer>DIBUAT DARI GOOGLE SHEETS &middot; @DT215BOT</footer>';
    document.getElementById('root').innerHTML = html;

    if (data.topKategori && data.topKategori.length > 0) drawDonut(data.topKategori);

    document.getElementById('btnPrev').onclick = function () { navigateMonth(-1); };
    document.getElementById('btnNext').onclick = function () { navigateMonth(1); };
    document.getElementById('tabsGranularity').onclick = function (e) {
      var g = e.target.getAttribute('data-g');
      if (!g) return;
      state.granularity = g;
      document.querySelectorAll('#tabsGranularity button').forEach(function (b) { b.classList.toggle('aktif', b === e.target); });
      loadTrend();
    };
    loadTrend();
  }

  function navigateMonth(delta) {
    var d = new Date(state.tahun, state.bulan - 1 + delta, 1);
    loadSummary(d.getMonth() + 1, d.getFullYear());
  }

  function loadTrend() {
    apiCall({ action: 'trend', granularity: state.granularity }, function (res) {
      if (res.ok) drawTrend(res.trend);
    });
  }

  function loadSummary(bulan, tahun) {
    var params = {};
    if (bulan && tahun) { params.bulan = bulan; params.tahun = tahun; }
    apiCall(params, function (data) {
      if (!data.ok) { showError(data.message || 'Gagal memuat data.'); return; }
      render(data);
    });
  }

  function loadDashboardData() {
    if (!tg || !tg.initData) {
      showError('Buka dashboard ini lewat tombol Dashboard di bot Telegram-nya ya.');
      return;
    }
    if (PROXY_URL.indexOf('PASTE_URL') !== -1) {
      showError('PROXY_URL belum diisi di file ini.');
      return;
    }
    loadSummary();
  }

  loadDashboardData();
</script>
</body>
</html>
